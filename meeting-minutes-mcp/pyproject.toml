[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-minutes-mcp"
version = "0.1.0"
description = "免費、本機執行的 MCP server：上傳音檔 → Whisper 轉逐字稿 → 依範本整理成會議記錄"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0",
    "faster-whisper>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
meeting-minutes-mcp = "meeting_minutes_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meeting_minutes_mcp = ["templates/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
